name: CI

# Deliberately light. This package is 366 lines of adapter against a
# developer-preview host; the expensive verification is a real `dsh` run
# against a real rapid-mlx server on Apple Silicon, which no hosted runner
# can do. What CI can do is stop a syntax error or a malformed manifest
# from ever reaching a `dsh plugin add`.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'   # the Zstd-stream floor dsh needs

      - name: Parse every shipped module
        run: |
          set -euo pipefail
          find lib -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "all modules parse"

      - name: Lint (no-undef — a free identifier that only fails at runtime)
        run: |
          npm install --no-save --no-audit --no-fund eslint@^9 >/dev/null 2>&1
          npx eslint .

      - name: Unit tests
        # lib/request.js imports nothing, so the request-mapping tests run
        # here without installing the dsh peer dep. They cover the two bug
        # classes that do not raise anything when they regress: a dropped
        # GenerateOptions field, and a mis-mapped tool result.
        run: npm test

      - name: The manifest must still declare a dsh bundle
        run: |
          set -euo pipefail
          node -e '
            const p = require("./package.json");
            const patch = p?.dsh?.bundle?.patch;
            if (!patch) {
              console.error("package.json lost dsh.bundle.patch — dsh would install this");
              console.error("as an inert dependency and only WARN about it. See README.");
              process.exit(1);
            }
            const fs = require("fs");
            if (!fs.existsSync(patch)) {
              console.error(`dsh.bundle.patch points at ${patch}, which does not exist`);
              process.exit(1);
            }
            console.log(`dsh.bundle.patch -> ${patch} (present)`);
          '

      - name: The bundle patch must be a loadable entry list
        run: |
          set -euo pipefail
          # Pinned to v4: v5 reworked the custom-tag API (Type/extend ->
          # defineScalarTag/Schema) and this is a lint helper, not a dependency
          # of the shipped package.
          npm install --no-save --no-audit --no-fund js-yaml@^4 >/dev/null 2>&1
          node -e '
            const yaml = require("js-yaml");
            const fs = require("fs");
            // `!!js` is a DSH-specific tag (its loader evaluates the
            // expression at boot). Plain js-yaml rejects it, so declare it
            // as an opaque scalar — we are checking the document is
            // well-formed, not evaluating it.
            const JS = new yaml.Type("tag:yaml.org,2002:js", {
              kind: "scalar",
              construct: (data) => String(data ?? ""),
            });
            const schema = yaml.DEFAULT_SCHEMA.extend([JS]);
            const doc = yaml.load(fs.readFileSync("cordis.patch.yml", "utf8"), { schema });
            if (!Array.isArray(doc)) {
              console.error("cordis.patch.yml must be a top-level ARRAY of patch entries");
              process.exit(1);
            }
            // The whole point of the file is the insert list; an empty
            // document would install a plugin that activates nothing.
            const inserts = doc.flatMap((e) => e?.insert ?? []);
            if (!inserts.length) {
              console.error("no `insert` entries — this bundle would activate nothing");
              process.exit(1);
            }
            for (const e of inserts) {
              if (!e?.id || !e?.name) {
                console.error("every insert entry needs both id and name:", JSON.stringify(e));
                process.exit(1);
              }
            }
            console.log(`cordis.patch.yml OK — inserts: ${inserts.map((e) => e.id).join(", ")}`);
          '

      - name: Refuse to publish by accident
        run: |
          set -euo pipefail
          node -e '
            const p = require("./package.json");
            if (p.private !== true) {
              console.error("package.json is no longer private. This package tracks a");
              console.error("developer preview and is not ready for npm — remove this");
              console.error("check deliberately in the PR that decides to publish.");
              process.exit(1);
            }
            console.log("private: true — npm publish is blocked");
          '
